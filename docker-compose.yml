version: '3.8'

services:
  webserver:
    image: nginx:alpine
    container_name: cinemax_landing_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpbackend

  phpbackend:
    image: php:8.2-fpm-alpine
    container_name: cinemax_landing_php
    restart: always
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_FCGI_MAX_REQUESTS=1000

networks:
  default:
    name: cinemax_network
